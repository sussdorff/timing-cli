agentic_acceptance:
  resources:
    - id: timing-cli
      type: cli
      provenance:
        kind: candidate_projection
        identity: timing-cli
        digest_env: TIMING_CLI_CANDIDATE_SHA256
      credentials:
        mode: none
        references: []
      boundaries:
        executable: bin/timing
        allowed_argv_prefixes:
          - [--help]
          - [info]
          - [projects, --local-only]
          - [usage]
          - [summary]
          - [suggest]
          - [reconstruct]
          - [--no-color, --help]
          - [--no-color, info]
          - [--no-color, projects, --local-only]
          - [--no-color, usage]
          - [--no-color, summary]
          - [--no-color, suggest]
          - [--no-color, reconstruct]
        cwd: "."
    - id: timing-cli-verification
      type: artifact
      provenance:
        kind: candidate_projection
        identity: timing-cli-verification
        digest_env: TIMING_CLI_VERIFICATION_SHA256
      credentials:
        mode: none
        references: []
      boundaries:
        roots:
          - evidence
          - README.md
          - CHANGELOG.md
        read_only: true
